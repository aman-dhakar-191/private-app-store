name: Android

# Test build on pull requests and on main. Releases are made by the Release workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test scripts
        run: |
          scripts/test-next-version.sh
          python3 scripts/test-build-index.py

      # Not signed with the release key; versionCode 1 so it never blocks a real release.
      - name: Build APK
        run: |
          ./gradlew --no-daemon assembleRelease -PversionName=0.0.0-dev -PversionCode=1
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/app-store-dev.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-store-dev-apk
          path: dist/*.apk
